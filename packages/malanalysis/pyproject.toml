[project]
name = "malanalysis"
version = "2.0.0"
description = "Completeness check, metrics, statistics and exhibits for the HLG-Net confirmatory study: protocol Steps 11-14, 17"
requires-python = ">=3.9"
dependencies = ["malcore>=2.0.0", "numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["malanalysis"]
